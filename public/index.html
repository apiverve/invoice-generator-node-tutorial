<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Invoice Generator</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
      min-height: 100vh;
      padding: 40px 20px;
      color: #e0e0e0;
    }

    .container {
      max-width: 900px;
      margin: 0 auto;
    }

    header {
      text-align: center;
      margin-bottom: 40px;
    }

    h1 {
      font-size: 2.5rem;
      margin-bottom: 8px;
      background: linear-gradient(135deg, #00d4aa, #00b4d8);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .subtitle {
      color: #888;
      font-size: 1.1rem;
    }

    .invoice-form {
      background: #1e1e2e;
      border-radius: 16px;
      padding: 32px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
    }

    .form-section {
      margin-bottom: 32px;
    }

    .form-section h2 {
      font-size: 1.1rem;
      color: #00d4aa;
      margin-bottom: 16px;
      padding-bottom: 8px;
      border-bottom: 1px solid #2a2a3e;
    }

    .form-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 16px;
    }

    @media (max-width: 600px) {
      .form-grid {
        grid-template-columns: 1fr;
      }
    }

    .form-group {
      display: flex;
      flex-direction: column;
    }

    .address-tail {
      display: grid;
      grid-template-columns: 1fr 1.4fr;
      gap: 12px;
    }

    .form-group.full-width {
      grid-column: 1 / -1;
    }

    label {
      font-size: 0.85rem;
      color: #888;
      margin-bottom: 6px;
    }

    input, textarea {
      padding: 12px;
      border: 1px solid #2a2a3e;
      border-radius: 8px;
      background: #16162a;
      color: #e0e0e0;
      font-size: 1rem;
      transition: border-color 0.2s;
    }

    input:focus, textarea:focus {
      outline: none;
      border-color: #00d4aa;
    }

    /* Items Section */
    .items-list {
      margin-bottom: 16px;
    }

    .item-row {
      display: grid;
      grid-template-columns: 2fr 1fr 1fr auto;
      gap: 12px;
      margin-bottom: 12px;
      align-items: end;
    }

    @media (max-width: 600px) {
      .item-row {
        grid-template-columns: 1fr;
      }
    }

    .remove-btn {
      padding: 12px 16px;
      background: #ef4444;
      border: none;
      border-radius: 8px;
      color: white;
      cursor: pointer;
      font-size: 1rem;
      transition: background 0.2s;
    }

    .remove-btn:hover {
      background: #dc2626;
    }

    .add-item-btn {
      padding: 12px 20px;
      background: transparent;
      border: 1px dashed #2a2a3e;
      border-radius: 8px;
      color: #00d4aa;
      cursor: pointer;
      font-size: 0.95rem;
      transition: all 0.2s;
    }

    .add-item-btn:hover {
      border-color: #00d4aa;
      background: rgba(0, 212, 170, 0.1);
    }

    /* Generate Button */
    .generate-btn {
      width: 100%;
      padding: 16px;
      background: linear-gradient(135deg, #00d4aa, #00b4d8);
      border: none;
      border-radius: 12px;
      color: #1a1a2e;
      font-size: 1.1rem;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
    }

    .generate-btn:hover:not(:disabled) {
      transform: translateY(-2px);
      box-shadow: 0 4px 20px rgba(0, 212, 170, 0.4);
    }

    .generate-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none;
    }

    /* Result */
    .result {
      margin-top: 24px;
      padding: 20px;
      background: rgba(0, 212, 170, 0.1);
      border: 1px solid rgba(0, 212, 170, 0.3);
      border-radius: 12px;
      text-align: center;
      display: none;
    }

    .result.show {
      display: block;
    }

    .result h3 {
      color: #00d4aa;
      margin-bottom: 12px;
    }

    .download-btn {
      display: inline-block;
      padding: 12px 24px;
      background: #00d4aa;
      color: #1a1a2e;
      text-decoration: none;
      border-radius: 8px;
      font-weight: 600;
      transition: background 0.2s;
    }

    .download-btn:hover {
      background: #00b4d8;
    }

    .error {
      margin-top: 16px;
      padding: 12px;
      background: rgba(239, 68, 68, 0.1);
      border: 1px solid rgba(239, 68, 68, 0.3);
      border-radius: 8px;
      color: #f87171;
      display: none;
    }

    .error.show {
      display: block;
    }

    footer {
      text-align: center;
      margin-top: 40px;
      color: #666;
      font-size: 0.9rem;
    }

    footer a {
      color: #00d4aa;
      text-decoration: none;
    }

    footer a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>Invoice Generator</h1>
      <p class="subtitle">Create professional PDF invoices instantly</p>
    </header>

    <div class="invoice-form">
      <!-- Invoice Details -->
      <div class="form-section">
        <h2>Invoice Details</h2>
        <div class="form-grid">
          <div class="form-group">
            <label>Invoice Number</label>
            <input type="text" id="invoiceNumber" value="INV-001" required>
          </div>
          <div class="form-group">
            <label>Invoice Date</label>
            <input type="date" id="invoiceDate" required>
          </div>
          <div class="form-group">
            <label>Due Date</label>
            <input type="date" id="dueDate" required>
          </div>
          <div class="form-group">
            <label>Currency</label>
            <input type="text" id="currency" value="USD" maxlength="3">
          </div>
          <div class="form-group">
            <label>Payment terms</label>
            <input type="text" id="paymentTerms" maxlength="100" value="Net 30">
          </div>
          <div class="form-group">
            <label>Job or project</label>
            <input type="text" id="job" maxlength="100" value="Spring website refresh">
          </div>
        </div>
      </div>

      <!-- From (your business) -->
      <div class="form-section">
        <h2>From (your business)</h2>
        <div class="form-grid">
          <div class="form-group full-width">
            <label>Name</label>
            <input type="text" id="from_name" maxlength="100" placeholder="Northwind Studio" value="Northwind Studio">
          </div>
          <div class="form-group full-width">
            <label>Street</label>
            <input type="text" id="from_street" maxlength="100" placeholder="500 Congress Ave" value="500 Congress Ave">
          </div>
          <div class="form-group">
            <label>City</label>
            <input type="text" id="from_city" maxlength="60" placeholder="Austin" value="Austin">
          </div>
          <div class="form-group address-tail">
            <div class="form-group">
              <label>State</label>
              <input type="text" id="from_state" maxlength="2" placeholder="TX" value="TX">
            </div>
            <div class="form-group">
              <label>ZIP</label>
              <input type="text" id="from_zip" maxlength="10" placeholder="78701" value="78701">
            </div>
          </div>
        </div>
      </div>

      <!-- Bill to -->
      <div class="form-section">
        <h2>Bill to</h2>
        <div class="form-grid">
          <div class="form-group full-width">
            <label>Name</label>
            <input type="text" id="to_name" maxlength="100" placeholder="Contoso Retail" value="Contoso Retail">
          </div>
          <div class="form-group full-width">
            <label>Street</label>
            <input type="text" id="to_street" maxlength="100" placeholder="1200 17th St" value="1200 17th St">
          </div>
          <div class="form-group">
            <label>City</label>
            <input type="text" id="to_city" maxlength="60" placeholder="Denver" value="Denver">
          </div>
          <div class="form-group address-tail">
            <div class="form-group">
              <label>State</label>
              <input type="text" id="to_state" maxlength="2" placeholder="CO" value="CO">
            </div>
            <div class="form-group">
              <label>ZIP</label>
              <input type="text" id="to_zip" maxlength="10" placeholder="80202" value="80202">
            </div>
          </div>
        </div>
      </div>

      <!-- Line Items -->
      <div class="form-section">
        <h2>Line Items</h2>
        <div class="items-list" id="itemsList">
          <div class="item-row">
            <div class="form-group">
              <label>Description</label>
              <input type="text" class="item-desc" maxlength="120" placeholder="Service or product" value="Homepage design" required>
            </div>
            <div class="form-group">
              <label>Quantity</label>
              <input type="number" class="item-qty" value="1" min="1" required>
            </div>
            <div class="form-group">
              <label>Unit Price</label>
              <input type="number" class="item-price" placeholder="0.00" step="0.01" value="2400" required>
            </div>
            <button type="button" class="remove-btn" onclick="removeItem(this)">×</button>
          </div>
        </div>
        <button type="button" class="add-item-btn" onclick="addItem()">+ Add Item</button>
      </div>

      <!-- Tax and discount -->
      <div class="form-section">
        <h2>Tax and discount</h2>
        <div class="form-grid">
          <div class="form-group">
            <label>Sales tax (%)</label>
            <input type="number" id="salesTax" min="0" max="100" step="0.01" value="8.25">
          </div>
          <div class="form-group">
            <label>Discount (amount)</label>
            <input type="number" id="discount" min="0" step="0.01" placeholder="0.00">
          </div>
        </div>
      </div>

      <button class="generate-btn" id="generateBtn" onclick="generateInvoice()">
        Generate Invoice PDF
      </button>

      <div class="error" id="error"></div>

      <div class="result" id="result">
        <h3>Invoice Generated!</h3>
        <a href="#" class="download-btn" id="downloadBtn" target="_blank">Download PDF</a>
      </div>
    </div>

    <footer>
      <p>
        Powered by
        <a href="https://apiverve.com/marketplace/invoicegenerator?utm_source=github&utm_medium=template&utm_campaign=invoice-generator-node-tutorial"
           target="_blank">
          APIVerve Invoice Generator API
        </a>
      </p>
    </footer>
  </div>

  <script>
    // Set default dates
    const today = new Date().toISOString().split('T')[0];
    const dueDate = new Date();
    dueDate.setDate(dueDate.getDate() + 30);
    document.getElementById('invoiceDate').value = today;
    document.getElementById('dueDate').value = dueDate.toISOString().split('T')[0];

    // Add new line item
    function addItem() {
      const itemsList = document.getElementById('itemsList');
      const newRow = document.createElement('div');
      newRow.className = 'item-row';
      newRow.innerHTML = `
        <div class="form-group">
          <label>Description</label>
          <input type="text" class="item-desc" placeholder="Service or product" required>
        </div>
        <div class="form-group">
          <label>Quantity</label>
          <input type="number" class="item-qty" value="1" min="1" required>
        </div>
        <div class="form-group">
          <label>Unit Price</label>
          <input type="number" class="item-price" placeholder="0.00" step="0.01" required>
        </div>
        <button type="button" class="remove-btn" onclick="removeItem(this)">×</button>
      `;
      itemsList.appendChild(newRow);
    }

    // Remove line item
    function removeItem(btn) {
      const rows = document.querySelectorAll('.item-row');
      if (rows.length > 1) {
        btn.closest('.item-row').remove();
      }
    }

    // Generate invoice
    async function generateInvoice() {
      const btn = document.getElementById('generateBtn');
      const error = document.getElementById('error');
      const result = document.getElementById('result');

      // Collect line items
      const items = [];
      document.querySelectorAll('.item-row').forEach(row => {
        const desc = row.querySelector('.item-desc').value;
        const qty = parseFloat(row.querySelector('.item-qty').value) || 1;
        const price = parseFloat(row.querySelector('.item-price').value) || 0;

        if (desc && price > 0) {
          items.push({ description: desc, qty, unit_price: price });
        }
      });

      if (items.length === 0) {
        error.textContent = 'Please add at least one line item';
        error.classList.add('show');
        return;
      }

      // Field names match the Invoice Generator API; the server passes only these on.
      const val = (id) => document.getElementById(id).value.trim();
      const invoiceData = {
        invoiceNumber: val('invoiceNumber'),
        date: val('invoiceDate'),
        dueDate: val('dueDate'),
        currency: val('currency').toUpperCase() || 'USD',
        paymentTerms: val('paymentTerms'),
        job: val('job'),
        salesTax: val('salesTax'),
        discount: val('discount'),
        items
      };
      for (const p of ['from', 'to']) {
        for (const f of ['name', 'street', 'city', 'state', 'zip']) invoiceData[`${p}_${f}`] = val(`${p}_${f}`);
      }

      btn.disabled = true;
      btn.textContent = 'Generating...';
      error.classList.remove('show');
      result.classList.remove('show');

      try {
        const response = await fetch('/api/generate', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(invoiceData)
        });

        const data = await response.json();

        if (data.success && data.pdfUrl) {
          document.getElementById('downloadBtn').href = data.pdfUrl;
          result.classList.add('show');
        } else {
          error.textContent = data.error || 'Failed to generate invoice';
          error.classList.add('show');
        }
      } catch (err) {
        error.textContent = 'Failed to connect to server';
        error.classList.add('show');
      } finally {
        btn.disabled = false;
        btn.textContent = 'Generate Invoice PDF';
      }
    }
  </script>
</body>
</html>
